services:
  postgres:
    image: postgres:16-alpine
    container_name: led-sup-bot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: led_sup_bot
    ports:
      - "5432:5432"
    volumes:
      - led_sup_bot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d led_sup_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  led_sup_bot_pgdata:
