name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore LedSupBot.sln
      - name: Build
        run: dotnet build LedSupBot.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test LedSupBot.sln --configuration Release --no-build --verbosity normal
        # PostgreSQL persistence tests use Testcontainers (requires Docker on the runner).

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
